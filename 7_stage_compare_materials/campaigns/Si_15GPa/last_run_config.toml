# Written by hp_pilot.py on 2026-10-22 18:30:32
# HP-Pilot settings.
# [project] is shared by all stages. Each [stageN] section belongs to one stage folder.
# Change values here instead of editing the code.

[project]
name = "hp-pilot"
composition = "Si"        # any formula pymatgen understands, e.g. "Si", "NaCl", "MgSiO3"
pressure_gpa = 15.0       # target pressure in GPa (used from stage 2 on)
seed = 42                 # same seed = same random structures, so runs are repeatable

[stage1]
generator = "pyxtal_random"   # which tool makes structures; options are in 1_stage_create_structure/generators.py
n_structures = 20             # how many candidate structures to keep
formula_units = [2, 4, 8]     # cell sizes to try, in formula units (Si with 4 -> 4 atoms)
space_groups = []             # empty list = pick randomly from all space groups 2..230
volume_factor = 1.0           # <1 makes denser starting cells; relaxation fixes the volume anyway
max_attempts = 500            # stop trying after this many failed or successful attempts
min_bond_ratio = 0.7          # reject a structure if any two atoms are closer than this fraction
                              # of their normal bond length (sum of covalent radii); 0 = no filter

[stage2]
input = ""                    # "" = use stage 1 output. Or a path to your own structure(s):
                              # one file (CIF, POSCAR, .extxyz) or a folder of such files
model = "mace_mp_medium"      # which model relaxes the structures; options are in hp_models.py
pressures_gpa = []            # empty = use pressure_gpa from [project]; or a list, e.g. [0, 15, 30]
optimizer = "FIRE"            # "FIRE" (robust) or "BFGS" (faster near the minimum)
fmax = 0.05                   # stop when every force is below this (eV/A); smaller = tighter, slower
max_steps = 300               # give up on a structure after this many steps
n_threads = 8                 # CPU cores used by the model (YARGLA has 48)
save_trajectories = false     # true = save every relaxation step to outputs/traj/ (for debugging)

[stage3]
input = ""                    # "" = use stage 2 output (relaxed.extxyz)
models = ["mace_mp_medium", "mace_mpa_medium", "mace_mp_small"]   # the "committee"; options in hp_models.py
checks = ["relax_status", "enthalpy_spread", "pressure_deviation", "force", "short_bond", "collapse"]
                              # which checks to run; each one is defined in 3_stage_trust_check/trust_checks.py
n_threads = 8
# Limits below are first guesses (PROVISIONAL). They should be tuned on known cases later.
max_enthalpy_spread_meV = 20.0    # models disagree on relative enthalpy by more than this -> Needs DFT
max_pressure_deviation_gpa = 3.0  # another model thinks the pressure is off by more than this -> Needs DFT
max_force_eV_A = 0.25             # another model sees forces larger than this on the "relaxed" atoms -> Needs DFT
min_bond_ratio = 0.8              # atoms closer than this fraction of a normal bond -> Needs DFT
collapse_fraction = 0.75          # volume below this fraction of the typical (median) volume -> Needs DFT
dft_window_meV = 100.0            # Needs DFT structures within this of the best get priority "high"
make_plot = true

[stage4]
input = ""                    # "" = use stage 3 output (needs_dft.extxyz)
max_structures = 3            # how many Needs DFT structures to prepare (best-ranked high priority first); 0 = all
ids = []                      # or name exact structures, e.g. ["s019", "s003"]; overrides max_structures
trusted_controls = 1          # also prepare this many Trusted structures, to test whether "Trusted" was right
profile = "quick"             # accuracy level: "quick" (minutes, for testing) or "standard"; see incar_rules.py
checks = ["potcars", "encut", "pstress", "isif", "spin"]   # hard checks every input must pass
potcar_dir = "../0_stage_softwares_resources_etc/potcars"   # folder that contains POT_GGA_PAW_PBE/
xrd_wavelength = "CuKa"       # for the XRD plot; e.g. "MoKa", or a number in Angstrom for synchrotron (0.4133)

# Job planning (how the calculations are split into SLURM jobs)
partition = "defq"
n_batches = 0                 # 0 = decide automatically from cluster load; or a fixed number of jobs
max_parallel_jobs = 4         # never plan more jobs than this at once
cores_per_job = 0             # 0 = choose from structure size (small cells don't speed up on many cores)
time_limit = "01:00:00"       # per job (hh:mm:ss)
vasp_dir = "/opt/ohpc/pub/software/vasp.6.4.2"
vasp_exe = "vasp_std"
make_plots = true
